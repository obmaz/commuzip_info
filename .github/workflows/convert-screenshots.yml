name: Convert landing screenshots to JPG

on:
  push:
    paths:
      - ".github/workflows/convert-screenshots.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert screenshots
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          files = [
              "assets/01-menu.png",
              "assets/02-favorites.png",
              "assets/03-post.png",
              "assets/04-settings.png",
              "assets/05-dark.png",
              "assets/06-add.png",
              "assets/08-read.png",
          ]
          for name in files:
              src = Path(name)
              dst = src.with_suffix(".jpg")
              im = Image.open(src).convert("RGB")
              im.save(dst, "JPEG", quality=84, optimize=True, progressive=True)
              if dst.stat().st_size <= 0:
                  raise SystemExit(f"empty output: {dst}")
              print(dst, dst.stat().st_size)
          PY

      - name: Update landing page
        run: |
          sed -i \
            -e 's#01-menu.png#01-menu.jpg#g' \
            -e 's#02-favorites.png#02-favorites.jpg#g' \
            -e 's#03-post.png#03-post.jpg#g' \
            -e 's#04-settings.png#04-settings.jpg#g' \
            -e 's#05-dark.png#05-dark.jpg#g' \
            -e 's#06-add.png#06-add.jpg#g' \
            -e 's#08-read.png#08-read.jpg#g' \
            index.html

      - name: Remove old PNG screenshots
        run: |
          rm assets/01-menu.png assets/02-favorites.png assets/03-post.png assets/04-settings.png assets/05-dark.png assets/06-add.png assets/08-read.png

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert landing screenshots to JPG"
          git push
