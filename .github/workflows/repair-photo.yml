name: Repair seventh screenshot

on:
  push:
    paths:
      - ".github/workflows/repair-photo.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github.raw+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/obmaz/community/contents/store/screenshots/play-store/kova-2026-09-14/png/07-photo.png"             -o /tmp/07-photo.png
          test -s /tmp/07-photo.png

      - name: Convert to web JPG
        run: |
          set -e
          ffmpeg -loglevel error -y -i /tmp/07-photo.png -vf "scale='min(1080,iw)':-2" -q:v 5 assets/07-photo.jpg
          test -s assets/07-photo.jpg
          ls -lh assets/07-photo.jpg

      - name: Switch landing page to JPG
        run: |
          sed -i 's#./assets/07-photo.png#./assets/07-photo.jpg#g' index.html

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/07-photo.jpg index.html
          git commit -m "Repair seventh landing screenshot"
          git push
